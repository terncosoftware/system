#
# Build, test, and publish all Tern packages to GitHub Packages (npm).
#
# Publish triggers:
#   - Push to main          → clean release, e.g. 0.1.87
#   - Push to release/*     → pre-release with branch suffix, e.g. 0.1.88-release-1-2
#   - Push of v{M}.{N} tag  → overrides major.minor for all packages, e.g. 1.2.89
#
# Versioning (scripts/version.mjs):
#   patch       = GITHUB_RUN_NUMBER (monotonically increasing, unique per run)
#   major.minor = from a v{M}.{N}[.*] git tag on HEAD; falls back to package.json
#   suffix      = -<sanitized-branch> on non-main branch builds; none on main or tags
#
# Required secrets: none — the automatic GITHUB_TOKEN has packages:write.
#
# Consuming the published packages outside this monorepo:
#   Add to your .yarnrc.yml:
#
#     npmScopes:
#       terncosoftware:
#         npmRegistryServer: "https://npm.pkg.github.com"
#         npmAlwaysAuth: true
#
#   Then authenticate:
#     YARN_NPM_AUTH_TOKEN=<github-pat-packages-read> yarn install
#
name: build-and-publish

on:
  push:
    branches:
      - main
      - 'release/*'
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:

env:
  # actions/delete-package-versions@v5 still targets node20; force it onto
  # node24 until the action publishes a native node24 release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── 1. Build + test ──────────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Real Postgres for every suite's Postgres leg (repo law: integration tests
    # hit real infra). The test harness gives each vitest worker its own
    # database on this server (packages/test/src/postgres), so suites running
    # in parallel never share tables.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sys
          POSTGRES_USER: sys
          POSTGRES_PASSWORD: sys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sys -d sys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Real Redis for the bus suites. Each one writes under its own key prefix,
      # so they share this instance safely when vitest runs them in parallel.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Corepack must be enabled before setup-node so that the `cache: yarn`
      # option resolves the cache directory with Yarn 4, not the pre-installed
      # Yarn 1.22 that ships on the runner.
      - name: Enable Corepack
        run: corepack enable

      - name: Activate Yarn 4.1.0
        run: corepack prepare yarn@4.1.0 --activate

      - name: Setup Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build all packages
        run: yarn build

      - name: Verify generated files are up to date
        # Codegen is the source of truth: every *.generated.ts is derived from
        # the .ttl ontologies via the `tern` manifest in each package.json, and
        # the output is checked in. Regenerate everything and fail if the tree
        # moved: that catches both a hand-edited generated file and a .ttl
        # change that was never regenerated.
        #
        # Runs after the build because tern-codegen is a workspace binary
        # compiled from packages/gen.
        run: |
          set -euo pipefail
          yarn workspaces foreach --all run gen
          # --intent-to-add so a brand new generated file that was never
          # committed shows up in the diff instead of passing as untracked.
          git add --intent-to-add .
          if git diff --exit-code; then
            echo "Generated files are up to date."
            exit 0
          fi
          stale=$(git diff --name-only)
          echo "::error::Generated files are stale. Codegen output differs from what is committed."
          echo ""
          echo "Stale file(s):"
          echo "${stale}" | sed 's/^/  /'
          echo ""
          echo "These files are generated from the .ttl ontologies and must not be edited by hand."
          echo "To fix, run this at the repo root and commit the result:"
          echo ""
          echo "  yarn workspaces foreach --all run gen"
          echo ""
          exit 1

      - name: Run test suite (SQLite + real Postgres)
        # The run must end with the harness's Postgres count, with at least one
        # passed test; a run whose Postgres legs all skipped fails here.
        env:
          SYS_PG_URL: postgresql://sys:sys@localhost:5432/sys
          SYS_REDIS_URL: redis://localhost:6379
        run: |
          set -euo pipefail
          yarn test 2>&1 | tee test-output.log
          summary=$(sed 's/\x1b\[[0-9;]*m//g' test-output.log | grep -E '^Postgres legs: [1-9][0-9]* passed' || true)
          if [ -z "${summary}" ]; then
            echo "::error::No Postgres-leg tests passed. Check that SYS_PG_URL reaches the postgres service."
            exit 1
          fi
          echo "::notice title=Postgres legs::${summary}"
          echo "${summary}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run dashboards suite
        run: yarn workspace @terncosoftware/dashboards test

  # ── 2. Build and push Docker images to GHCR ──────────────────────────────────
  docker:
    needs: build-and-test
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: server
            image: system-server
          - name: web
            image: system-web

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.target.image }}
          tags: |
            type=sha,format=short,length=8
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build and push ${{ matrix.target.name }}
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          target: ${{ matrix.target.name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 3. Publish npm packages to GitHub Packages ────────────────────────────────
  publish:
    needs: build-and-test
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Enable Corepack
        run: corepack enable

      - name: Activate Yarn 4.1.0
        run: corepack prepare yarn@4.1.0 --activate

      - name: Setup Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Compute versions
        # scripts/version.mjs sets the version for every publishable package:
        #   patch       = GITHUB_RUN_NUMBER (unique per run, always increasing)
        #   major.minor = git tag v{M}.{N} on HEAD if present; else package.json
        #   suffix      = -<branch> for non-main branch builds; none otherwise
        # Runs before `yarn build` so version.json (written by stamp.mjs) and
        # the compiled output both carry the final version.
        run: node scripts/version.mjs

      - name: Build all packages
        # Full rebuild after versioning so stamp.mjs writes the correct version
        # into version.json and compiled artefacts exist for packing.
        # TypeScript project references enforce correct dependency order.
        run: yarn build

      - name: Publish packages
        # Publishes in dependency order so consumers never see a package whose
        # deps are not yet in the registry.
        # Yarn converts workspace:^ → ^<version> automatically when packing.
        run: |
          set -euo pipefail
          fail=0

          publish_pkg() {
            local pkg="$1"
            echo ""
            echo "──────────────────────────────────────────"
            echo "  Publishing @terncosoftware/${pkg} …"
            echo "──────────────────────────────────────────"

            local out
            out=$(cd "packages/$pkg" && yarn npm publish --access public 2>&1) && {
              echo "$out"
              echo "  ✓ @terncosoftware/${pkg} published"
              return 0
            }

            echo "$out"
            echo "  ✗ @terncosoftware/${pkg} failed"
            fail=1
          }

          # Layer 0 — no @terncosoftware deps
          publish_pkg core
          publish_pkg core-ui
          publish_pkg vaults

          # Layer 1 — depend only on core (or core + flow)
          publish_pkg data
          publish_pkg events
          publish_pkg flow
          publish_pkg worker
          publish_pkg gen
          publish_pkg api
          publish_pkg app
          publish_pkg dashboards

          # Layer 2 — depends on core + data + gen
          publish_pkg entities

          # Layer 3 — depends on core + data + entities + flow
          publish_pkg server
          publish_pkg auth

          exit $fail
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Prune old patch versions (keep last 10) ───────────────────────────────
  cleanup:
    needs: publish
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        package: [api, app, auth, core, data, entities, flow, gen, server, vaults, worker]

    steps:
      - name: Prune old versions of @terncosoftware/${{ matrix.package }}
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: npm
          min-versions-to-keep: 10
